<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patches Inventory - Production Team Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }

    /* LOGIN PAGE */
    .login-page {
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    .logo-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #5568d3;
    }

    .error-message {
      color: #e53e3e;
      font-size: 14px;
      margin-top: 10px;
      padding: 10px;
      background: #fff5f5;
      border-radius: 6px;
      display: none;
    }

    /* DASHBOARD */
    .dashboard {
      display: none;
    }

    .header {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-badge {
      background: #667eea;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .logout-btn {
      background: #e53e3e;
      padding: 8px 16px;
      font-size: 14px;
      width: auto;
    }

    .logout-btn:hover {
      background: #c53030;
    }

    /* TABS */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: white;
      padding: 10px;
      border-radius: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #f0f0f0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.3s;
    }

    .tab-btn.active {
      background: #667eea;
      color: white;
    }

    /* INVENTORY TAB */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .materials-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .material-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .material-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 15px;
      color: #333;
    }

    .color-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
    }

    .color-item:last-child {
      border-bottom: none;
    }

    .quantity-badge {
      background: #e2e8f0;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      color: #333;
    }

    .quantity-badge.low {
      background: #fed7d7;
      color: #c53030;
    }

    .deduct-input {
      width: 50px;
      padding: 4px;
      font-size: 12px;
    }

    .deduct-btn {
      background: #48bb78;
      padding: 4px 12px;
      font-size: 12px;
      width: auto;
      margin-left: 5px;
    }

    .deduct-btn:hover {
      background: #38a169;
    }

    /* ADMIN PANEL */
    .admin-section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .admin-section h3 {
      margin-bottom: 15px;
      color: #333;
    }

    .users-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .users-table th {
      background: #f0f0f0;
      padding: 10px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #e0e0e0;
    }

    .users-table td {
      padding: 10px;
      border-bottom: 1px solid #e0e0e0;
    }

    .delete-btn {
      background: #e53e3e;
      padding: 4px 12px;
      font-size: 12px;
      width: auto;
    }

    .delete-btn:hover {
      background: #c53030;
    }

    .form-section {
      background: #f9fafb;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .success-message {
      background: #c6f6d5;
      color: #22543d;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    @media (max-width: 600px) {
      .login-page {
        padding: 30px 20px;
      }

      .materials-grid {
        grid-template-columns: 1fr;
      }

      .header {
        flex-direction: column;
        gap: 10px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="container login-page">
  <div class="logo-section">
    <div class="logo">📦</div>
    <h1>Patches Inventory</h1>
    <p class="subtitle">Production Team Portal</p>
  </div>

  <div class="form-group">
    <label>USERNAME</label>
    <input type="text" id="username" placeholder="Enter username">
  </div>

  <div class="form-group">
    <label>PASSWORD</label>
    <input type="password" id="password" placeholder="Enter password">
  </div>

  <button onclick="login()">🔐 Sign In</button>

  <div class="error-message" id="loginError"></div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard container">
  
  <!-- HEADER -->
  <div class="header">
    <div>
      <h1 style="margin-bottom: 5px;">📦 Patches Inventory</h1>
      <p class="subtitle" style="margin: 0;">Production Team Portal</p>
    </div>
    <div class="user-info">
      <div>
        <div style="font-weight: 600; color: #333;" id="currentUser"></div>
        <div class="user-badge" id="currentRole"></div>
      </div>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('inventory')">📊 Inventory</button>
    <button class="tab-btn" id="adminTabBtn" onclick="switchTab('admin')" style="display: none;">⚙️ Admin Panel</button>
  </div>

  <!-- INVENTORY TAB -->
  <div id="inventoryTab" class="tab-content active">
    <div id="materialsContainer" class="materials-grid">
      <div class="loading">Loading inventory...</div>
    </div>
  </div>

  <!-- ADMIN TAB -->
  <div id="adminTab" class="tab-content">
    
    <!-- USERS LIST -->
    <div class="admin-section">
      <h3>👥 Manage Users</h3>
      <div class="success-message" id="successMessage"></div>
      <table class="users-table">
        <thead>
          <tr>
            <th>Username</th>
            <th>Role</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="usersList">
          <tr><td colspan="3" style="text-align: center; color: #999;">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- CREATE NEW USER -->
    <div class="admin-section">
      <h3>➕ Create New User</h3>
      <div class="form-section">
        <div class="form-row">
          <input type="text" id="newUsername" placeholder="Username">
          <input type="password" id="newPassword" placeholder="Password">
        </div>
        <div class="form-row">
          <select id="newRole" style="padding: 12px; border: 2px solid #e0e0e0; border-radius: 6px;">
            <option>Admin</option>
            <option>Supervisor</option>
            <option>Purchaser</option>
          </select>
          <button onclick="createUser()">Create User</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const API_URL = '/api';
let currentUser = null;
let currentToken = null;

// ============================================
// LOGIN
// ============================================

async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorDiv = document.getElementById('loginError');

  if (!username || !password) {
    errorDiv.textContent = '❌ Please enter username and password';
    errorDiv.style.display = 'block';
    return;
  }

  try {
    const response = await fetch(`${API_URL}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await response.json();

    if (!response.ok) {
      errorDiv.textContent = '❌ Invalid username or password';
      errorDiv.style.display = 'block';
      return;
    }

    // Store token and user
    currentToken = data.token;
    currentUser = data.user;

    // Save to localStorage
    localStorage.setItem('token', currentToken);
    localStorage.setItem('user', JSON.stringify(currentUser));

    // Show dashboard
    showDashboard();

  } catch (error) {
    errorDiv.textContent = '❌ Connection error: ' + error.message;
    errorDiv.style.display = 'block';
  }
}

// ============================================
// DASHBOARD
// ============================================

function showDashboard() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  document.getElementById('currentUser').textContent = currentUser.username;
  document.getElementById('currentRole').textContent = currentUser.role;

  // Show admin tab only for admins
  if (currentUser.role === 'Admin') {
    document.getElementById('adminTabBtn').style.display = 'block';
  }

  loadInventory();
}

async function loadInventory() {
  try {
    const response = await fetch(`${API_URL}/material-types`, {
      headers: { 'Authorization': `Bearer ${currentToken}` }
    });

    if (!response.ok) {
      throw new Error('Failed to load inventory');
    }

    const materials = await response.json();
    renderInventory(materials);

  } catch (error) {
    document.getElementById('materialsContainer').innerHTML = `<div style="color: red;">❌ ${error.message}</div>`;
  }
}

function renderInventory(materials) {
  let html = '';

  materials.forEach(material => {
    const colors = material.colors && material.colors.length > 0 ? material.colors : [];
    
    html += `
      <div class="material-card">
        <div class="material-title">${material.name}</div>
    `;

    if (colors.length === 0) {
      html += '<div style="color: #999; font-size: 13px;">No colors added yet</div>';
    }

    colors.forEach(color => {
      const isLow = color.quantity <= color.reorderLevel;
      const badgeClass = isLow ? 'low' : '';

      html += `
        <div class="color-item">
          <span>${color.name}</span>
          <div style="display: flex; gap: 5px; align-items: center;">
            <span class="quantity-badge ${badgeClass}">${color.quantity} ${color.unit}</span>
      `;

      // Show deduct button only for Supervisor and Admin
      if (currentUser.role !== 'Purchaser') {
        html += `
          <input type="number" class="deduct-input" id="deduct-${color.id}" value="1" min="1">
          <button class="deduct-btn" onclick="deductStock(${color.id})">-</button>
        `;
      }

      html += `
          </div>
        </div>
      `;
    });

    html += '</div>';
  });

  document.getElementById('materialsContainer').innerHTML = html || '<div style="color: #999;">No materials found</div>';
}

async function deductStock(colorId) {
  const input = document.getElementById(`deduct-${colorId}`);
  const amount = parseInt(input.value);

  if (!amount || amount <= 0) {
    alert('❌ Please enter a valid amount');
    return;
  }

  try {
    const response = await fetch(`${API_URL}/color-variants/${colorId}/deduct`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${currentToken}`
      },
      body: JSON.stringify({ amount })
    });

    if (response.ok) {
      alert('✅ Stock deducted successfully');
      input.value = '1';
      loadInventory();
    } else {
      alert('❌ Failed to deduct stock');
    }
  } catch (error) {
    alert('❌ Error: ' + error.message);
  }
}

// ============================================
// ADMIN PANEL
// ============================================

async function loadUsers() {
  try {
    const response = await fetch(`${API_URL}/users`, {
      headers: { 'Authorization': `Bearer ${currentToken}` }
    });

    if (!response.ok) {
      throw new Error('Failed to load users');
    }

    const users = await response.json();
    renderUsers(users);

  } catch (error) {
    document.getElementById('usersList').innerHTML = `<tr><td colspan="3" style="color: red;">❌ ${error.message}</td></tr>`;
  }
}

function renderUsers(users) {
  let html = '';

  users.forEach(user => {
    html += `
      <tr>
        <td>${user.username}</td>
        <td><span class="user-badge">${user.role}</span></td>
        <td>
          <button class="delete-btn" onclick="deleteUser(${user.id})">Delete</button>
        </td>
      </tr>
    `;
  });

  document.getElementById('usersList').innerHTML = html || '<tr><td colspan="3" style="text-align: center;">No users</td></tr>';
}

async function createUser() {
  const username = document.getElementById('newUsername').value;
  const password = document.getElementById('newPassword').value;
  const role = document.getElementById('newRole').value;
  const successDiv = document.getElementById('successMessage');

  if (!username || !password) {
    alert('❌ Please fill all fields');
    return;
  }

  try {
    const response = await fetch(`${API_URL}/users`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${currentToken}`
      },
      body: JSON.stringify({ username, password, role })
    });

    const data = await response.json();

    if (response.ok) {
      successDiv.textContent = `✅ User "${username}" created successfully`;
      successDiv.style.display = 'block';
      document.getElementById('newUsername').value = '';
      document.getElementById('newPassword').value = '';
      setTimeout(() => { successDiv.style.display = 'none'; }, 3000);
      loadUsers();
    } else {
      alert('❌ ' + (data.error || 'Failed to create user'));
    }
  } catch (error) {
    alert('❌ Error: ' + error.message);
  }
}

async function deleteUser(userId) {
  if (!confirm('Are you sure you want to delete this user?')) {
    return;
  }

  try {
    // Note: This endpoint doesn't exist yet, but we can add it later
    alert('❌ Delete user feature coming soon');
  } catch (error) {
    alert('❌ Error: ' + error.message);
  }
}

function switchTab(tab) {
  // Hide all tabs
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

  // Show selected tab
  document.getElementById(tab + 'Tab').classList.add('active');
  event.target.classList.add('active');

  // Load admin data if admin tab
  if (tab === 'admin') {
    loadUsers();
  }
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  currentUser = null;
  currentToken = null;

  document.getElementById('loginPage').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
}

// ============================================
// ON PAGE LOAD
// ============================================

window.onload = function() {
  const savedToken = localStorage.getItem('token');
  const savedUser = localStorage.getItem('user');

  if (savedToken && savedUser) {
    currentToken = savedToken;
    currentUser = JSON.parse(savedUser);
    showDashboard();
  }
};
</script>

</body>
</html>
