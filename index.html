<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patches Inventory - Production Team Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ============================================
       LOGIN PAGE
       ============================================ */

    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      z-index: 1000;
    }

    .login-box {
      background: white;
      padding: 50px;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 450px;
      width: 100%;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-logo-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .login-title {
      font-size: 28px;
      font-weight: 700;
      color: #333;
      margin-bottom: 5px;
    }

    .login-subtitle {
      color: #999;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 13px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .login-btn:hover {
      background: #5568d3;
    }

    .login-error {
      color: #e53e3e;
      font-size: 13px;
      padding: 10px;
      background: #fff5f5;
      border-radius: 6px;
      margin-top: 15px;
      display: none;
    }

    .login-container.hidden {
      display: none;
    }

    /* ============================================
       DASHBOARD
       ============================================ */

    .dashboard {
      display: none;
    }

    .dashboard.active {
      display: block;
    }

    .header {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .header-left h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 5px;
    }

    .header-right {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .user-info {
      text-align: right;
    }

    .user-name {
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    .user-role {
      background: #667eea;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 5px;
      display: inline-block;
    }

    .logout-btn {
      background: #e53e3e;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .logout-btn:hover {
      background: #c53030;
    }

    /* TABS */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .tab-btn:hover {
      border-color: #667eea;
    }

    /* TAB CONTENT */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ADD MATERIAL SECTION */
    .add-material-section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .add-material-section h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 15px;
      color: #333;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 100px;
      gap: 10px;
    }

    .form-row input,
    .form-row select {
      padding: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 13px;
    }

    .add-btn {
      background: #48bb78;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      margin: 0;
    }

    .add-btn:hover {
      background: #38a169;
    }

    /* INVENTORY */
    .materials-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .material-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .material-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e0e0e0;
    }

    .material-name {
      font-size: 16px;
      font-weight: 700;
      color: #333;
    }

    .material-unit {
      font-size: 12px;
      color: #999;
    }

    .material-actions {
      display: flex;
      gap: 5px;
    }

    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 5px 10px;
      transition: opacity 0.3s;
    }

    .action-btn:hover {
      opacity: 0.7;
    }

    .color-item {
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .color-item:last-child {
      border-bottom: none;
    }

    .color-left {
      flex: 1;
    }

    .color-name {
      font-weight: 600;
      color: #333;
    }

    .quantity-badge {
      background: #e2e8f0;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 600;
      color: #333;
      font-size: 12px;
      margin-top: 3px;
    }

    .quantity-badge.low {
      background: #fed7d7;
      color: #c53030;
    }

    .color-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .deduct-input {
      width: 40px;
      padding: 5px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 12px;
    }

    .deduct-btn {
      background: #48bb78;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .deduct-btn:hover {
      background: #38a169;
    }

    .edit-btn {
      background: #4299e1;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .edit-btn:hover {
      background: #3182ce;
    }

    .delete-btn {
      background: #e53e3e;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .delete-btn:hover {
      background: #c53030;
    }

    /* ADMIN PANEL */
    .admin-section {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .admin-section h3 {
      font-size: 18px;
      font-weight: 700;
      color: #333;
      margin-bottom: 20px;
    }

    .users-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .users-table th {
      background: #f7fafc;
      padding: 12px;
      text-align: left;
      font-weight: 700;
      color: #333;
      border-bottom: 2px solid #e0e0e0;
    }

    .users-table td {
      padding: 12px;
      border-bottom: 1px solid #e0e0e0;
    }

    .user-badge {
      background: #667eea;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      display: inline-block;
    }

    .form-section {
      background: #f7fafc;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .success-message {
      background: #c6f6d5;
      color: #22543d;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }

    .hidden-tab {
      display: none;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .header-right {
        flex-direction: column;
        justify-content: center;
      }

      .materials-grid {
        grid-template-columns: 1fr;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .login-box {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginContainer" class="login-container">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">📦</div>
      <h1 class="login-title">Patches Inventory</h1>
      <p class="login-subtitle">Production Team Portal</p>
    </div>

    <div class="form-group">
      <label>USERNAME</label>
      <input type="text" id="username" placeholder="Enter your username">
    </div>

    <div class="form-group">
      <label>PASSWORD</label>
      <input type="password" id="password" placeholder="Enter your password">
    </div>

    <button class="login-btn" onclick="login()">🔐 Sign In</button>
    
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">
  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <div class="header-left">
        <h1>📦 Patches Inventory</h1>
        <p style="color: #999; font-size: 13px;">Production Team Portal</p>
      </div>
      <div class="header-right">
        <div class="user-info">
          <div class="user-name" id="currentUser"></div>
          <div class="user-role" id="currentRole"></div>
        </div>
        <button class="logout-btn" onclick="logout()">Sign Out</button>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('inventory')">📊 Inventory</button>
      <button class="tab-btn hidden-tab" id="adminTabBtn" onclick="switchTab('admin')">⚙️ Admin Panel</button>
    </div>

    <!-- INVENTORY TAB -->
    <div id="inventoryTab" class="tab-content active">
      
      <!-- ADD MATERIAL (ADMIN ONLY) -->
      <div id="addMaterialSection" class="add-material-section" style="display: none;">
        <h3>➕ Add New Material Type</h3>
        <div class="success-message" id="materialSuccess"></div>
        <div class="form-row">
          <input type="text" id="newMatName" placeholder="Material name (e.g., Viscose Thread)">
          <input type="text" id="newMatUnit" placeholder="Unit (e.g., cones, yards)">
          <input type="number" id="newMatReorder" placeholder="Reorder level" value="20" min="1">
          <button class="add-btn" onclick="addMaterial()">Add Material</button>
        </div>
      </div>

      <!-- MATERIALS GRID -->
      <div id="materialsContainer" class="materials-grid">
        <div class="loading">Loading inventory...</div>
      </div>
    </div>

    <!-- ADMIN TAB -->
    <div id="adminTab" class="tab-content">
      
      <!-- USERS LIST -->
      <div class="admin-section">
        <h3>👥 Manage Users</h3>
        <div class="success-message" id="successMessage"></div>
        <table class="users-table">
          <thead>
            <tr>
              <th>Username</th>
              <th>Role</th>
              <th>Created</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="usersList">
            <tr><td colspan="4" class="loading">Loading users...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- CREATE USER -->
      <div class="admin-section">
        <h3>➕ Create New User</h3>
        <div class="form-section">
          <div class="form-row">
            <input type="text" id="newUsername" placeholder="Username">
            <input type="password" id="newPassword" placeholder="Password">
            <select id="newRole">
              <option>Admin</option>
              <option>Supervisor</option>
              <option>Purchaser</option>
            </select>
            <button class="add-btn" onclick="createUser()">Create</button>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>

<script>
const API_URL = '/api';
let currentUser = null;
let currentToken = null;

// ============================================
// LOGIN
// ============================================

async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorDiv = document.getElementById('loginError');

  if (!username || !password) {
    errorDiv.textContent = '❌ Please enter username and password';
    errorDiv.style.display = 'block';
    return;
  }

  try {
    const response = await fetch(`${API_URL}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await response.json();

    if (!response.ok) {
      errorDiv.textContent = '❌ Invalid username or password';
      errorDiv.style.display = 'block';
      return;
    }

    currentToken = data.token;
    currentUser = data.user;

    localStorage.setItem('token', currentToken);
    localStorage.setItem('user', JSON.stringify(currentUser));

    showDashboard();

  } catch (error) {
    errorDiv.textContent = '❌ Connection error: ' + error.message;
    errorDiv.style.display = 'block';
  }
}

// ============================================
// DASHBOARD
// ============================================

function showDashboard() {
  document.getElementById('loginContainer').classList.add('hidden');
  document.getElementById('dashboard').classList.add('active');

  document.getElementById('currentUser').textContent = currentUser.username;
  document.getElementById('currentRole').textContent = currentUser.role;

  // Show admin features only for admins
  if (currentUser.role === 'Admin') {
    document.getElementById('adminTabBtn').classList.remove('hidden-tab');
    document.getElementById('addMaterialSection').style.display = 'block';
  }

  loadInventory();
}

async function loadInventory() {
  try {
    const response = await fetch(`${API_URL}/material-types`, {
      headers: { 'Authorization': `Bearer ${currentToken}` }
    });

    if (!response.ok) throw new Error('Failed to load inventory');

    const materials = await response.json();
    renderInventory(materials);

  } catch (error) {
    document.getElementById('materialsContainer').innerHTML = `<div style="color: red;">❌ ${error.message}</div>`;
  }
}

function renderInventory(materials) {
  let html = '';

  materials.forEach(material => {
    const colors = material.colors && material.colors.length > 0 ? material.colors : [];
    
    html += `
      <div class="material-card">
        <div class="material-header">
          <div>
            <div class="material-name">${material.name}</div>
            <div class="material-unit">${material.unit} (Reorder: ${material.reorder_level})</div>
          </div>
          ${currentUser.role === 'Admin' ? `
            <div class="material-actions">
              <button class="action-btn" title="Edit">✏️</button>
              <button class="action-btn" title="Delete">🗑️</button>
            </div>
          ` : ''}
        </div>
    `;

    if (colors.length === 0) {
      html += '<div style="color: #999; font-size: 13px;">No colors added</div>';
    }

    colors.forEach(color => {
      const isLow = color.quantity <= color.reorderLevel;
      const badgeClass = isLow ? 'low' : '';

      html += `
        <div class="color-item">
          <div class="color-left">
            <div class="color-name">${color.name}</div>
            <div class="quantity-badge ${badgeClass}">${color.quantity} ${color.unit}</div>
          </div>
          <div class="color-actions">
      `;

      if (currentUser.role !== 'Purchaser') {
        html += `
          <input type="number" class="deduct-input" id="deduct-${color.id}" value="1" min="1">
          <button class="deduct-btn" onclick="deductStock(${color.id})">Deduct</button>
        `;
      }

      if (currentUser.role === 'Admin') {
        html += `
          <button class="edit-btn" onclick="editColor(${color.id})">Edit</button>
          <button class="delete-btn" onclick="deleteColor(${color.id})">Delete</button>
        `;
      }

      html += `
          </div>
        </div>
      `;
    });

    html += '</div>';
  });

  document.getElementById('materialsContainer').innerHTML = html || '<div style="color: #999;">No materials found</div>';
}

async function addMaterial() {
  const name = document.getElementById('newMatName').value;
  const unit = document.getElementById('newMatUnit').value;
  const reorderLevel = document.getElementById('newMatReorder').value;
  const successDiv = document.getElementById('materialSuccess');

  if (!name || !unit) {
    alert('❌ Please fill all fields');
    return;
  }

  try {
    const response = await fetch(`${API_URL}/material-types`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${currentToken}`
      },
      body: JSON.stringify({ name, unit, reorderLevel: parseInt(reorderLevel) })
    });

    const data = await response.json();

    if (response.ok) {
      successDiv.textContent = `✅ Material "${name}" added successfully`;
      successDiv.style.display = 'block';
      document.getElementById('newMatName').value = '';
      document.getElementById('newMatUnit').value = '';
      document.getElementById('newMatReorder').value = '20';
      setTimeout(() => { successDiv.style.display = 'none'; }, 3000);
      loadInventory();
    } else {
      alert('❌ ' + (data.error || 'Failed to add material'));
    }
  } catch (error) {
    alert('❌ Error: ' + error.message);
  }
}

async function deductStock(colorId) {
  const input = document.getElementById(`deduct-${colorId}`);
  const amount = parseInt(input.value);

  if (!amount || amount <= 0) {
    alert('❌ Please enter a valid amount');
    return;
  }

  try {
    const response = await fetch(`${API_URL}/color-variants/${colorId}/deduct`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${currentToken}`
      },
      body: JSON.stringify({ amount })
    });

    if (response.ok) {
      input.value = '1';
      loadInventory();
    } else {
      alert('❌ Failed to deduct stock');
    }
  } catch (error) {
    alert('❌ Error: ' + error.message);
  }
}

function editColor(colorId) {
  alert('Edit feature coming soon');
}

function deleteColor(colorId) {
  if (confirm('Are you sure?')) {
    alert('Delete feature coming soon');
  }
}

// ============================================
// ADMIN PANEL
// ============================================

async function loadUsers() {
  try {
    const response = await fetch(`${API_URL}/users`, {
      headers: { 'Authorization': `Bearer ${currentToken}` }
    });

    if (!response.ok) throw new Error('Failed to load users');

    const users = await response.json();
    renderUsers(users);

  } catch (error) {
    document.getElementById('usersList').innerHTML = `<tr><td colspan="4" style="color: red;">❌ ${error.message}</td></tr>`;
  }
}

function renderUsers(users) {
  let html = '';

  users.forEach(user => {
    const created = new Date(user.created_at).toLocaleDateString();
    html += `
      <tr>
        <td>${user.username}</td>
        <td><span class="user-badge">${user.role}</span></td>
        <td>${created}</td>
        <td>
          <button class="delete-btn" onclick="deleteUser(${user.id})">Delete</button>
        </td>
      </tr>
    `;
  });

  document.getElementById('usersList').innerHTML = html || '<tr><td colspan="4">No users</td></tr>';
}

async function createUser() {
  const username = document.getElementById('newUsername').value;
  const password = document.getElementById('newPassword').value;
  const role = document.getElementById('newRole').value;
  const successDiv = document.getElementById('successMessage');

  if (!username || !password) {
    alert('❌ Please fill all fields');
    return;
  }

  try {
    const response = await fetch(`${API_URL}/users`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${currentToken}`
      },
      body: JSON.stringify({ username, password, role })
    });

    const data = await response.json();

    if (response.ok) {
      successDiv.textContent = `✅ User "${username}" created successfully`;
      successDiv.style.display = 'block';
      document.getElementById('newUsername').value = '';
      document.getElementById('newPassword').value = '';
      setTimeout(() => { successDiv.style.display = 'none'; }, 3000);
      loadUsers();
    } else {
      alert('❌ ' + (data.error || 'Failed to create user'));
    }
  } catch (error) {
    alert('❌ Error: ' + error.message);
  }
}

function deleteUser(userId) {
  if (confirm('Delete this user?')) {
    alert('Delete user feature coming soon');
  }
}

function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

  document.getElementById(tab + 'Tab').classList.add('active');
  event.target.classList.add('active');

  if (tab === 'admin') {
    loadUsers();
  }
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  currentUser = null;
  currentToken = null;

  document.getElementById('loginContainer').classList.remove('hidden');
  document.getElementById('dashboard').classList.remove('active');
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
}

// ============================================
// ON PAGE LOAD
// ============================================

window.onload = function() {
  const savedToken = localStorage.getItem('token');
  const savedUser = localStorage.getItem('user');

  if (savedToken && savedUser) {
    currentToken = savedToken;
    currentUser = JSON.parse(savedUser);
    showDashboard();
  }
};
</script>
